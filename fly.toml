app = "traka-server"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

# Runs migrations before new machines start
release_command = "node dist/scripts/migrate.js up"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    port = 8080
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
