openapi: 3.0.0
info:
  title: TRAKA Logistics API
  description: Comprehensive logistics and package tracking platform with rider ratings, wallet management, and delivery scheduling
  version: 3.0.0
  contact:
    name: TRAKA Support
    email: support@traka.com

servers:
  - url: http://localhost:4000/api
    description: Development server
  - url: https://api.traka.com/api
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Live API key for third-party integrations. Format sk_live_...

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, MANAGER, RIDER, USER, BUSINESS_OWNER]
          description: Current permission level (can be changed)
        type:
          type: string
          enum: [SUPER_ADMIN, ADMIN, MANAGER, RIDER, USER, BUSINESS_OWNER]
          description: Permanent user classification
        tenant_id:
          type: string
          format: uuid
          nullable: true

    Package:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tracking_number:
          type: string
        status:
          type: string
          enum: [PENDING, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        schedule_type:
          type: string
          enum: [IMMEDIATE, SCHEDULED, SAME_DAY, NEXT_DAY]
        scheduled_for:
          type: string
          format: date-time
        cancellation_reason:
          type: string
          enum: [PILOT_ASKED_TO_CANCEL, LONG_PICKUP_TIME, WRONG_ORDER_DETAILS, RIDER_ASKING_DIFFERENT_MONEY, RIDER_UNTIDY_NO_UNIFORM, FOUND_ALTERNATIVE, OTHER]

    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        package_id:
          type: string
          format: uuid
        rider_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          maxLength: 500

    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is_default:
          type: boolean

    WalletBalance:
      type: object
      properties:
        balance:
          type: number
          format: decimal
        is_active:
          type: boolean
        credit_limit:
          type: number
          format: decimal

    RiderProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rider_id:
          type: string
          description: Unique rider identifier
        user_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
          nullable: true
        license_number:
          type: string
        vehicle_type:
          type: string
          enum: [BICYCLE, MOTORCYCLE]
        vehicle_plate:
          type: string
        profile_photo:
          type: string
          nullable: true
        license_photo:
          type: string
          nullable: true
        vehicle_photo:
          type: string
          nullable: true
        verification_status:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        is_available:
          type: boolean
        rider_type:
          type: string
          enum: [INDEPENDENT, BUSINESS_MANAGED]
        status:
          type: string
          enum: [AVAILABLE, BUSY, OFFLINE]
        current_latitude:
          type: number
          nullable: true
        current_longitude:
          type: number
          nullable: true
        avg_rating:
          type: number
          nullable: true
        total_ratings:
          type: integer
          nullable: true
        user:
          type: object
          properties:
            first_name:
              type: string
            surname:
              type: string
            phone:
              type: string
            email:
              type: string

    Error:
      type: object
      properties:
        error:
          type: string
        required:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            type: string
        coming_soon:
          type: boolean
        retry_after_seconds:
          type: integer
        details:
          type: string
          description: Only present in development

    PricingBreakdown:
      type: object
      properties:
        base_fee:
          type: number
        distance_fee:
          type: number
        speed_fee:
          type: number
        weight_multiplier:
          type: number
        platform_fee:
          type: number
        total_amount:
          type: number

    Dispatch:
      type: object
      properties:
        assigned:
          type: boolean
        attempts:
          type: integer
        message:
          type: string
        rider_id:
          type: string
          format: uuid
        eta_seconds:
          type: integer

    ExternalOrderInput:
      type: object
      required: [recipient_name, recipient_phone, pickup_address, delivery_address, description]
      properties:
        recipient_name:
          type: string
        recipient_phone:
          type: string
        recipient_email:
          type: string
          format: email
        pickup_address:
          type: string
        delivery_address:
          type: string
        description:
          type: string
        delivery_notes:
          type: string
        package_size:
          type: string
          enum: [SMALL, MEDIUM, LARGE]
          default: SMALL
        package_weight:
          type: number
          description: Actual weight in kg. Max 40 (over 40 is coming soon).
        delivery_speed:
          type: string
          enum: [STANDARD, EXPRESS, SAME_DAY]
          default: STANDARD
        category:
          type: string
        is_fragile:
          type: boolean
          default: false
        payment_method:
          type: string
          enum: [DIGITAL, CASH, BANK_TRANSFER]
          default: DIGITAL
        payment_by:
          type: string
          enum: [SENDER, RECIPIENT]
          default: SENDER

    ExternalOrderCreated:
      type: object
      properties:
        message:
          type: string
        order:
          type: object
          properties:
            id:
              type: string
              format: uuid
            tracking_number:
              type: string
            status:
              type: string
            tracking_url:
              type: string
            pricing_breakdown:
              $ref: '#/components/schemas/PricingBreakdown'
            dispatch:
              $ref: '#/components/schemas/Dispatch'

    BulkOrdersRequest:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExternalOrderInput'

    BulkOrdersResponse:
      type: object
      properties:
        summary:
          type: object
          properties:
            total:
              type: integer
            created:
              type: integer
            failed:
              type: integer
        orders:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              tracking_number:
                type: string
              status:
                type: string
              tracking_url:
                type: string
              pricing_breakdown:
                $ref: '#/components/schemas/PricingBreakdown'
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              reason:
                type: string

    ExternalOrderTracked:
      type: object
      properties:
        order:
          type: object
          properties:
            id:
              type: string
              format: uuid
            tracking_number:
              type: string
            status:
              type: string
            recipient_name:
              type: string
            recipient_email:
              type: string
            recipient_phone:
              type: string
            pickup_address:
              type: string
            delivery_address:
              type: string
            description:
              type: string
            delivery_notes:
              type: string
            package_size:
              type: string
            package_weight:
              type: number
            delivery_speed:
              type: string
            schedule_type:
              type: string
            scheduled_for:
              type: string
              format: date-time
            rider_id:
              type: string
            rider_has_package:
              type: boolean
            eta_minutes:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            delivered_at:
              type: string
              format: date-time
            is_guest_delivery:
              type: boolean
            live_tracking:
              type: object
            live_tracking_url:
              type: string

    UpdateRecipientRequest:
      type: object
      minProperties: 1
      properties:
        recipient_name:
          type: string
        recipient_phone:
          type: string
        recipient_email:
          type: string
          format: email
        delivery_address:
          type: string

    UpdateRecipientResponse:
      type: object
      properties:
        message:
          type: string
        tracking_number:
          type: string
        updated_fields:
          type: array
          items:
            type: string
        pricing_breakdown:
          $ref: '#/components/schemas/PricingBreakdown'

    ConfirmDeliveryResponse:
      type: object
      properties:
        message:
          type: string
        tracking_number:
          type: string
        status:
          type: string

    RideCreateResponse:
      type: object
      properties:
        message:
          type: string
        ride:
          type: object
          properties:
            id:
              type: string
              format: uuid
            tracking_number:
              type: string
            status:
              type: string
            tracking_url:
              type: string
            dispatch:
              $ref: '#/components/schemas/Dispatch'
            pricing_breakdown:
              $ref: '#/components/schemas/PricingBreakdown'

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            raw_key:
              type: string
              description: Shown only once at creation

    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    ApiKeysList:
      type: object
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'

    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        url:
          type: string
        secret:
          type: string
          description: Shown only once at creation
        events:
          type: array
          items:
            type: string
          description: order.created, order.status_changed, order.delivered, order.confirmed, rider.assigned, or *
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        last_delivery_at:
          type: string
          format: date-time
        failure_count:
          type: integer

    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string

    WebhooksList:
      type: object
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        event:
          type: string
        delivery_id:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, DEAD]
        attempt_count:
          type: integer
        max_attempts:
          type: integer
        last_attempt_at:
          type: string
          format: date-time
        last_status_code:
          type: integer
        last_error:
          type: string
        qstash_message_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookDeliveriesList:
      type: object
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'

paths:
  /:
    get:
      tags: [System]
      summary: API root
      description: Basic API root response.
      responses:
        '200':
          description: API root response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  docs:
                    type: string
  /health:
    get:
      tags: [System]
      summary: Health check
      servers:
        - url: http://localhost:4000
          description: Development server (root)
        - url: https://api.traka.com
          description: Production server (root)
      responses:
        '200':
          description: API health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
  # Authentication
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
        '401':
          description: Unauthorized

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Unauthorized

  /auth/register/customer:
    post:
      tags: [Authentication]
      summary: Customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, surname, phone]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                first_name:
                  type: string
                surname:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Customer registered successfully

  /auth/register/business:
    post:
      tags: [Authentication]
      summary: Business registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, business_name, business_address, contact_person, phone]
              properties:
                email:
                  type: string
                password:
                  type: string
                business_name:
                  type: string
                business_address:
                  type: string
                contact_person:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Business registered successfully

  /auth/register/rider:
    post:
      tags: [Authentication]
      summary: Rider registration with unique ID and email verification
      description: |
        Register a new rider account. Returns JWT token and encrypted user data.
        - Auto-generates unique rider ID (TRK-XXXX)
        - Sends email verification code
        - Returns encrypted user data for client-side decryption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, surname, phone, license_number, vehicle_type, vehicle_plate]
              properties:
                email:
                  type: string
                  format: email
                  example: rider@example.com
                password:
                  type: string
                  minLength: 6
                  example: SecurePass123!
                first_name:
                  type: string
                  example: John
                surname:
                  type: string
                  example: Doe
                phone:
                  type: string
                  example: "+2348012345678"
                license_number:
                  type: string
                  example: LIC-12345
                vehicle_type:
                  type: string
                  enum: [BICYCLE, MOTORCYCLE]
                  example: MOTORCYCLE
                vehicle_plate:
                  type: string
                  example: ABC-123-XY
                business_id:
                  type: string
                  format: uuid
                  description: Optional - for business-managed riders
      responses:
        '201':
          description: Rider registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Rider registered successfully. Please check your email for verification code."
                  token:
                    type: string
                    description: JWT authentication token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      tenant_id:
                        type: string
                        format: uuid
                        nullable: true
                  rider_profile:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      rider_id:
                        type: string
                        example: "TRK-1000"
                        description: Unique rider identifier
                      full_name:
                        type: string
                      rider_type:
                        type: string
                        enum: [INDEPENDENT, BUSINESS_MANAGED]
                      verification_status:
                        type: string
                        enum: [PENDING, VERIFIED, REJECTED]
                  verification_required:
                    type: boolean
                    example: true
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "User already exists"
        '500':
          description: Internal server error

  /auth/register/admin:
    post:
      tags: [Authentication]
      summary: Register an admin user (Super Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
                  enum: [ADMIN, MANAGER]
      responses:
        '201':
          description: Admin registered successfully
        '401':
          description: Unauthorized

  /auth/register:
    post:
      tags: [Authentication]
      summary: Legacy registration endpoint
      description: Backward-compatible registration endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Registration successful

  /auth/password/reset-request:
    post:
      tags: [Authentication]
      summary: Request password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset code sent
        '400':
          description: Validation error

  /auth/password/reset-confirm:
    post:
      tags: [Authentication]
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Validation error

  /auth/password/update:
    put:
      tags: [Authentication]
      summary: Update password for authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  # Rider Profile & Availability
  /riders/profile:
    get:
      tags: [Riders]
      summary: Get rider profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Rider profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        '404':
          description: Rider profile not found
        '401':
          description: Unauthorized
    put:
      tags: [Riders]
      summary: Update rider profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                surname:
                  type: string
                phone:
                  type: string
                vehicle_type:
                  type: string
                  enum: [BICYCLE, MOTORCYCLE]
                license_number:
                  type: string
                vehicle_plate:
                  type: string
                profile_photo:
                  type: string
                license_photo:
                  type: string
                vehicle_photo:
                  type: string
      responses:
        '200':
          description: Rider profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /riders/availability:
    put:
      tags: [Riders]
      summary: Update rider availability (online/offline)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Availability updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /riders/status:
    put:
      tags: [Riders]
      summary: Update rider status (AVAILABLE, BUSY, OFFLINE)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [AVAILABLE, BUSY, OFFLINE]
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /riders/location:
    put:
      tags: [Riders]
      summary: Update rider location
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /riders/eligibility:
    get:
      tags: [Riders]
      summary: Check if rider can receive orders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Eligibility status
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible:
                    type: boolean
        '401':
          description: Unauthorized

  /riders/register:
    post:
      tags: [Riders]
      summary: Create rider profile for an authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicle_type]
              properties:
                license_number:
                  type: string
