        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateRequest'
      responses:
        '201':
          description: Webhook subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  webhook:
                    $ref: '#/components/schemas/WebhookSubscription'
        '400':
          description: Invalid URL, empty events, or unknown events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Requires owner/admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /businesses/{business_id}/webhooks/{webhook_id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook subscription
      security:
        - BearerAuth: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook subscription deleted
        '404':
          description: Webhook subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Requires owner/admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /businesses/{business_id}/webhooks/{webhook_id}/deliveries:
    get:
      tags: [Webhooks]
      summary: List delivery attempts for a webhook subscription
      security:
        - BearerAuth: []
      parameters:
        - name: business_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery attempts retrieved (latest 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveriesList'
        '404':
          description: Webhook subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Requires owner/admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/external/orders:
    post:
      tags: [External]
      summary: Create a delivery order (external)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalOrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOrderCreated'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: No active owner account or out of coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Packages over 40kg are coming soon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/external/orders/bulk:
    post:
      tags: [External]
      summary: Create up to 50 orders in bulk (external)
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOrdersRequest'
      responses:
        '207':
          description: Partial success — inspect per-item results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOrdersResponse'
        '400':
          description: orders must be a non-empty array or maximum 50 exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/external/orders/{tracking_number}:
