                  enum: [PILOT_ASKED_TO_CANCEL, LONG_PICKUP_TIME, WRONG_ORDER_DETAILS, RIDER_ASKING_DIFFERENT_MONEY, RIDER_UNTIDY_NO_UNIFORM, FOUND_ALTERNATIVE, OTHER]
