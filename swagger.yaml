    get:
      tags: [Users]
      summary: Get all users with filters
      description: |
        Retrieve users filtered by role, type, or tenant_id.
        - `role`: Filter by current permission level
        - `type`: Filter by user classification (RIDER, USER, BUSINESS_OWNER, etc.)
        - `tenant_id`: Filter by business tenant
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          description: Filter by role
          schema:
            type: string
            enum: [SUPER_ADMIN, ADMIN, MANAGER, RIDER, USER, BUSINESS_OWNER]
        - name: type
          in: query
          description: Filter by user type
          schema:
            type: string
            enum: [SUPER_ADMIN, ADMIN, MANAGER, RIDER, USER, BUSINESS_OWNER]
        - name: tenant_id
          in: query
          description: Filter by tenant/business ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Users retrieved successfully
        '500':
          description: Failed to retrieve users
