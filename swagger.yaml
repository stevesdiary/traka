openapi: 3.0.0
info:
  title: TRAKA Logistics API
  description: Comprehensive logistics and package tracking platform
  version: 2.0.0
  contact:
    name: TRAKA Support
    email: support@traka.com

servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.traka.com/api
    description: Production server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, MANAGER, RIDER, USER]
        tenant_id:
          type: string
          format: uuid

    Package:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tracking_number:
          type: string
        status:
          type: string
          enum: [PENDING, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
        schedule_type:
          type: string
          enum: [IMMEDIATE, SCHEDULED, SAME_DAY, NEXT_DAY]
        scheduled_for:
          type: string
          format: date-time

    WalletBalance:
      type: object
      properties:
        balance:
          type: number
          format: decimal
        is_active:
          type: boolean
        credit_limit:
          type: number
          format: decimal

paths:
  # Authentication
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/register/customer:
    post:
      tags: [Authentication]
      summary: Customer registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                full_name:
                  type: string
                phone:
                  type: string
      responses:
        '201':
          description: Customer registered successfully

  # Package Management
  /packages:
    post:
      tags: [Packages]
      summary: Create package
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name:
                  type: string
                recipient_phone:
                  type: string
                delivery_address:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Package created successfully

  /packages/{tracking_number}:
    get:
      tags: [Packages]
      summary: Track package
      parameters:
        - name: tracking_number
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'

  # Scheduling
  /scheduling/schedule:
    post:
      tags: [Scheduling]
      summary: Schedule delivery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageId:
                  type: string
                  format: uuid
                scheduleType:
                  type: string
                  enum: [IMMEDIATE, SCHEDULED, SAME_DAY, NEXT_DAY]
                scheduledFor:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Delivery scheduled successfully

  # Wallet Management
  /wallet/balance:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: Get transaction history
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Transaction history

  /wallet/webhook/monnify:
    post:
      tags: [Wallet]
      summary: Monnify payment webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                eventData:
                  type: object
      responses:
        '200':
          description: Webhook processed

  # Delivery Matching
  /matching/dispatch:
    post:
      tags: [Matching]
      summary: Dispatch delivery
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                packageId:
                  type: string
                  format: uuid
                pickupLocation:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
                deliveryLocation:
                  type: object
                  properties:
                    latitude:
                      type: number
                    longitude:
                      type: number
      responses:
        '200':
          description: Delivery dispatched successfully

  # Legal Content
  /legal/faq:
    get:
      tags: [Legal]
      summary: Get FAQs
      responses:
        '200':
          description: FAQ content
          content:
            application/json:
              schema:
                type: object
                properties:
                  faqs:
                    type: object

  /legal/terms:
    get:
      tags: [Legal]
      summary: Get Terms of Service
      responses:
        '200':
          description: Terms of Service
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  content:
                    type: string
                  version:
                    type: string

  /legal/commission-policy:
    get:
      tags: [Legal]
      summary: Get Commission Policy
      responses:
        '200':
          description: Commission Policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  content:
                    type: string
                  version:
                    type: string

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Packages
    description: Package management and tracking
  - name: Scheduling
    description: Delivery scheduling system
  - name: Wallet
    description: Wallet and financial management
  - name: Matching
    description: Delivery matching and dispatch
  - name: Legal
    description: Legal content and policies