              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: No active owner account or out of coverage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
