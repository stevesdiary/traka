                type: object
                properties:
                  message:
                    type: string
                  profile:
                    $ref: '#/components/schemas/RiderProfile'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  # Package Management
  /packages:
    post:
      tags: [Packages]
      summary: Create package
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_name, recipient_phone, pickup_address, delivery_address, description, package_size, delivery_speed]
              properties:
                recipient_name:
                  type: string
                recipient_email:
                  type: string
                recipient_phone:
                  type: string
                pickup_address:
                  type: string
                delivery_address:
                  type: string
                description:
                  type: string
                delivery_notes:
                  type: string
                package_size:
                  type: string
                  enum: [SMALL, MEDIUM, LARGE]
                package_weight:
                  type: number
                delivery_speed:
                  type: string
                  enum: [STANDARD, EXPRESS, SAME_DAY]
                category:
                  type: string
                  enum: [FOOD, SHOES, ELECTRONICS, CLOTHING, JEWELRY_VALUABLES, GROCERIES, DOCUMENTS, HEALTH_PHARMACEUTICALS, CONSTRUCTION_MATERIALS, HOUSEHOLD_ITEMS, OTHERS]
                is_fragile:
                  type: boolean
      responses:
        '201':
          description: Package created successfully

  /packages/track/{tracking_number}:
    get:
      tags: [Packages]
      summary: Track package (public)
      parameters:
        - name: tracking_number
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '404':
          description: Package not found

  /packages/{tracking_number}:
    get:
      tags: [Packages]
      summary: Get package by tracking number (authenticated)
      security:
        - BearerAuth: []
      parameters:
        - name: tracking_number
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
        '401':
          description: Unauthorized

